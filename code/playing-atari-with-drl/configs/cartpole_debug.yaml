env_id: CartPole-v1
seed: 42
total_steps: 3000

env:
  angle_limit_deg: 80.0
  x_limit: 8.0
  pole_half_length: 1.2
  force_mag: 5.0
  gravity: 7.0
  max_episode_steps: 500
  screen_width: 1000
  screen_height: 520

network:
  type: mlp
  hidden_sizes: [64, 64]
  activation: relu

optimizer:
  type: adam
  lr: 0.001

loss:
  type: mse

rl:
  gamma: 0.99
  batch_size: 32
  replay_capacity: 5000
  learning_starts: 200
  train_frequency: 1
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_steps: 2000
  target_network: false
  target_update_steps: 500

eval:
  eval_every_steps: 500
  eval_episodes: 3
  greedy: true

logging:
  save_every_steps: 1500
  output_dir: outputs/cartpole_debug
